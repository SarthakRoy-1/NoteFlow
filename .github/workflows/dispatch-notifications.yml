# Triggers reminder email and push delivery on the API. A free Render instance sleeps when idle and
# cannot poll for itself; this call wakes it and runs one dispatch tick (safe to repeat: the delivery
# ledger in PostgreSQL makes sends idempotent).
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   NOTEFLOW_API_URL            e.g. https://noteflow-api-rm7b.onrender.com  (no trailing slash)
#   NOTIFICATIONS_CRON_SECRET   the same value as the API's NOTIFICATIONS_CRON_SECRET
# Without them the job exits successfully and does nothing. The job fails when the endpoint
# reports permanently failed deliveries, so a green run means nothing was lost on that tick.
#
# GitHub runs scheduled workflows on a best-effort basis (often a few minutes late) and pauses them
# after 60 days without repository activity. For tighter timing use cron-job.org or a Render cron job.
name: Dispatch reminder notifications

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dispatch-notifications
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the dispatch endpoint
        env:
          API_URL: ${{ secrets.NOTEFLOW_API_URL }}
          CRON_SECRET: ${{ secrets.NOTIFICATIONS_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Notification scheduler secrets are not set; nothing to do."
            exit 0
          fi
          # A cold Render instance can take about a minute to answer the first request.
          body=$(mktemp)
          status=$(curl --silent --show-error --max-time 120 --retry 2 --retry-delay 5             --output "$body" --write-out '%{http_code}'             --request POST             --header "Authorization: Bearer ${CRON_SECRET}"             "${API_URL%/}/api/internal/notifications/dispatch")
          echo "dispatch responded with HTTP ${status}"
          [ "$status" = "200" ] || exit 1
          # Print only the five aggregate counters, each forced to a number: never the raw body.
          counts=$(jq -c '{enqueued: (.enqueued|tonumber), sent: (.sent|tonumber),
            retried: (.retried|tonumber), failed: (.failed|tonumber), skipped: (.skipped|tonumber)}' "$body")
          echo "dispatch result: ${counts}"
          processed=$(echo "$counts" | jq '.sent + .retried + .failed + .skipped')
          failed=$(echo "$counts" | jq '.failed')
          retried=$(echo "$counts" | jq '.retried')
          echo "processed=${processed} failed=${failed} retried=${retried}"
          # A 200 only means the tick ran. Surface deliveries that did not go out.
          [ "$retried" -eq 0 ] || echo "::warning::${retried} notification(s) will be retried (provider unavailable)"
          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} notification(s) failed permanently; see the API logs (Notification delivery problem)"
            exit 1
          fi
